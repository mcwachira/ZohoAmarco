
name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test ZohoAmarco
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ZohoAmarco.sln

      - name: Verify formatting
        run: dotnet format ZohoAmarco.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build ZohoAmarco.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ZohoAmarco.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14
